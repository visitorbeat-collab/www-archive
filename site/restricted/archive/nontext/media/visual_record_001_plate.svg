  <title id="title">Visual record 001 physical reconstruction plate</title>
  <desc id="desc">A black-on-white structural plate with a central bounded form, broken concentric regions, outward pathways, repeated peripheral nodes, denser relationships toward the right edge, and three incomplete continuations.</desc>

  <metadata>
    Explicit vector construction for physical printing and photographic reconstruction.
    No generative image model, simulated texture, or source-system attribution.
  </metadata>

