<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>restricted</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/restricted/restricted.css">
</head>

<body>

<main class="document">

  <header class="document-header">

    <div class="eyebrow">
      /restricted/
    </div>

    <h1 class="document-title">
      classification boundary
    </h1>

    <div class="document-metadata">
      <span>status: restricted</span>
      <span>interpretation required</span>
    </div>

  </header>


  <section class="recovered-section">

    <p>
      Observation is not sufficient.
    </p>

    <p>
      Interpretation is required.
    </p>

  </section>


  <section class="recovered-section">

    <p class="mono">
      observation<br>
      ↓<br>
      interpretation<br>
      ↓<br>
      consequence<br>
      ↓<br>
      ?
    </p>

  </section>


  <section class="recovered-section">

    <p>
      Complete the relationship.
    </p>

    <form
      method="POST"
      action="/restricted/access"
      autocomplete="off"
    >

      <p>
        <label
          class="mono"
          for="response"
        >
          interpretation:
        </label>
      </p>

      <p>
        <input
          id="response"
          name="response"
          type="text"
          spellcheck="false"
          autocapitalize="none"
          autocomplete="off"
          required
          style="
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            background: transparent;
            color: inherit;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1rem;
          "
        >
      </p>

      <p>
        <button
          type="submit"
          style="
            background: transparent;
            color: inherit;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 10px 16px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
          "
        >
          submit
        </button>
      </p>

    </form>

    <p
      id="restricted-response"
      class="mono"
      style="display: none;"
    >
      condition not satisfied
    </p>

  </section>


  <footer class="document-footer">
    <a class="up-link" href="/">← up</a>
  </footer>

</main>


<script>
  const params = new URLSearchParams(window.location.search);

  if (params.get("error") === "1") {
    document.getElementById("restricted-response").style.display = "block";

    history.replaceState(
      {},
      "",
      window.location.pathname
    );
  }
</script>

</body>
</html>
