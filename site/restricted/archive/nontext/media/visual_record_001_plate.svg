      .tertiary { fill: none; stroke: #858a8e; stroke-width: 0.8; stroke-linecap: round; stroke-linejoin: round; }
      .region { fill: none; stroke: #555a5e; stroke-width: 1.1; stroke-dasharray: 34 13 9 18; }
      .node { fill: #fff; stroke: #151719; stroke-width: 1.8; }
      .node-light { fill: #fff; stroke: #62676b; stroke-width: 1.2; }
      .cap { stroke: #151719; stroke-width: 2.2; stroke-linecap: round; }
      .registration { fill: none; stroke: #a2a6a9; stroke-width: 0.75; }
    </style>
