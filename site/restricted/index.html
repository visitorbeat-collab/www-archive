<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restricted</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="document">
  <p class="meta">RESTRICTED</p>
  <h1>Interpretation required.</h1>
  <p>Additional context is required before material beyond this point can be responsibly interpreted.</p>

  <form data-password-form>
    <div class="password-row">
      <input data-password-input type="password" autocomplete="off" aria-label="Password">
      <button type="submit">Submit</button>
    </div>
  </form>

  <p id="password-status"></p>

  <footer class="document-footer">
    <hr>
    <p><a href="/">Parent Directory</a></p>
  </footer>
</main>
<script src="/js/main.js"></script>
</body>
</html>
