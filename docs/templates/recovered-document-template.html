<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RECOVERED DOCUMENT</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="recovered-page">
<main class="document">
  <header class="document-header">
    <div class="system-label">RECOVERED MATERIAL / STATUS</div>
    <h1 class="document-title">DOCUMENT_IDENTIFIER</h1>
    <div class="document-metadata">
      <span>revision: unknown</span>
      <span>provenance: unresolved</span>
    </div>
  </header>

  <section class="recovered-section">
    <h2><span class="recovered-section-number">1.0</span>SECTION</h2>
    <p>Recovered document content.</p>
  </section>

  <footer class="document-footer">
    <a class="up-link" href="/recovered/">← up</a>
  </footer>
</main>
<script src="/js/main.js"></script>
</body>
</html>
