<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — Observation Index</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="finder-page">

<main>

  <div class="system-label">OBSERVATION INDEX / RELATIONAL RETRIEVAL</div>

  <h1 class="index-title">Query Index</h1>

  <p class="index-subtitle">
    Folders preserve placement. This instrument retrieves relationships across classifications.
  </p>

  <div class="search-shell">

    <form id="concept-search-form">
      <label class="search-label" for="concept-search">
        query
      </label>

      <div class="search-row">
        <input
          id="concept-search"
          name="q"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="enter concept"
        >

        <button type="submit">search</button>
      </div>
    </form>

    <div id="search-response" class="search-response" aria-live="polite">
      <p class="muted">Loading current relations.</p>
    </div>
    
      <a class="up-link" href="/">← index</a>

  </div>

  <div class="directory-footer">
    Observation Index
  </div>

</main>

<script src="/js/main.js"></script>
<script src="/js/concept-search.js"></script>

</body>
</html>
